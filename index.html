tips:`<h2>🔎 วิธีสังเกตสินค้าปลอม</h2><ol><li><b>เช็กเลข อย.</b> ทุกครั้งที่ <a href="https://oryor.com/check-product-serial" target="_blank" rel="noopener">oryor.com/check-product-serial</a> หรือแอป/LINE <b>@FDAThai</b> — ชื่อสินค้า บริษัท และที่อยู่ต้องตรงกับฉลาก (เลขจดแจ้งเครื่องสำอาง 10 หลัก, เลขอาหาร 13 หลักในกรอบ อย.)</li><li><b>ราคาถูกผิดปกติ = สงสัยไว้ก่อน</b> โดยเฉพาะแบรนด์ดังที่ขายถูกกว่าห้าง 30–70%</li><li><b>ซื้อจากร้านทางการ</b> (Official / Mall บน Shopee, Lazada, TikTok) หรือร้านค้าที่มีหน้าร้านจริง</li><li><b>ดูฉลากภาษาไทย</b> ต้องมีชื่อผู้ผลิต/ผู้นำเข้า ที่อยู่ วันผลิต-หมดอายุ ฉลากพิมพ์เบลอ สะกดผิด สีเพี้ยน คือสัญญาณเตือน</li><li><b>เช็ก QR / สติกเกอร์กันปลอม</b> ของแบรนด์ (เช่น ยาสีฟัน แชมพู อาหารเสริมหลายยี่ห้อมี QR ตรวจของแท้)</li><li><b>อาหารเสริมโฆษณาเกินจริง</b> "ลดเร็ว 10 กก." "ฟิตปึ๋ง" มักผสมไซบูทรามีน/ซิลเดนาฟิล อันตรายถึงชีวิต</li><li><b>ห้ามซื้อยาฉีด ปากกาลดน้ำหนัก โบท็อกซ์ ฟิลเลอร์ ออนไลน์</b> ต้องใช้โดยแพทย์ในคลินิกที่ได้รับอนุญาตเท่านั้น</li><li><b>สินค้าเด็กอ่อน</b> ขวดนม จุกนม ซื้อจากตัวแทนจำหน่ายทางการเท่านั้น ของปลอมอาจปล่อยสารเคมีเมื่อโดนความร้อน</li><li><b>แจ้งเบาะแส:</b> สายด่วน อย. <b>1556</b> · ปคบ. <b>1135</b> · สคบ. <b>1166</b> · เพจ "ปคบ.เตือนภัยผู้บริโภค"</li></ol>`,
cav:`<b>หมายเหตุ</b><ul><li>รวบรวมจากข่าวและประกาศทางการที่เปิดเผยต่อสาธารณะเท่านั้น ไม่ใช่รายการครบถ้วนของทุกคดีในประเทศ</li><li>ชื่อแบรนด์ในคดี "ปลอม" คือแบรนด์ของแท้ที่ถูกลอกเลียน <b>ไม่ได้หมายความว่าสินค้าของแท้มีปัญหา</b></li><li>มูลค่ารวมส่วนใหญ่มาจากคดีใหญ่ (ศุลกากรสกลนคร ฿238 ล้าน, บุหรี่ไฟฟ้า ฿140 ล้าน/฿100 ล้าน, ผงชูรสปลอม ฿15.9 ล้าน) หลายคดีไม่ระบุมูลค่า</li><li>ไม่พบคดี Colgate / Sensodyne หรือนมผงเด็กปลอมในช่วงเวลานี้ คดียาสีฟันปลอม D.dent / Dentiste (มี.ค. 2569) อยู่นอกช่วงเวลาจึงไม่นับ</li><li>ผลตรวจ อย. (คดี 12–25) เป็นผลวิเคราะห์ผลิตภัณฑ์ ไม่ใช่การจับกุม</li></ul>`},
en:{tag:"⚠ Reported cases only",h1:"Fake &amp; unsafe <span>products busted</span> in Thailand",sub:"Busts by police (CIB/ECD/Cyber), FDA (อย.), Customs and DSI, from news reports and FDA notices, Aug 9 – Nov 9, 2026 (last updated Nov 9, 2026). Covers cosmetics, supplements, food, medicines, toothpaste, baby products, e-cigarettes, engine oil and other goods. Photos are from the sources; click to enlarge.",copy:"🔗 Copy link",copied:"✅ Copied",st:["cases","seizure value stated (฿M)","brands / products tagged","categories","hazardous substances found"],allb:"All brands impacted",allbh:"(click to filter · 🔴 counterfeited · 🟠 unsafe product · 🔵 unregistered / unlabelled)",all:"All",q:"Search brand, place, chemical…",so:["Newest first","Biggest seizure","Category"],bi:"Brands impacted",src:"Source",val:"Value",mb:"฿M",maph:"🗺 Where the cases were found",mapn:"Pins are approximate (centre of the reported district/province), not exact addresses. Click a pin for details.",nolh:"Cases with no location (not pinned)",none:"No matching cases",go:"view",
tips:`<h2>🔎 How to spot fakes</h2><ol><li><b>Check the อย. number</b> at <a href="https://oryor.com/check-product-serial" target="_blank" rel="noopener">oryor.com/check-product-serial</a> or LINE <b>@FDAThai</b>; product, company and address must match the label.</li><li><b>Too cheap = suspicious</b>, especially famous brands 30–70% below retail.</li><li><b>Buy from official stores</b> (Official/Mall shops on Shopee, Lazada, TikTok) or real shops.</li><li><b>Check the Thai label</b>: maker/importer, address, MFD/EXP. Blurry print, typos, off colours are red flags.</li><li><b>Scan brand QR / anti-counterfeit stickers</b> where available.</li><li><b>Miracle claims</b> ("lose 10 kg fast", sex boosters) often hide sibutramine/sildenafil.</li><li><b>Never buy injectables, weight-loss pens, Botox or fillers online</b>.</li><li><b>Baby bottles and teats</b>: official distributors only.</li><li><b>Report:</b> FDA <b>1556</b> · Consumer police <b>1135</b> · OCPB <b>1166</b>.</li></ol>`,
cav:`<b>Caveats</b><ul><li>Compiled only from public news reports and official notices; not every case in Thailand.</li><li>For "counterfeit" cases the brand named is the genuine brand that was copied; <b>it does not mean the genuine product is unsafe</b>.</li><li>The ฿ total is dominated by a few big cases (Sakon Nakhon customs ฿238M, e-cig ops ฿140M/฿100M, fake MSG ฿15.9M); many cases state no value.</li><li>No Colgate/Sensodyne or fake infant-formula cases were found in this window; the D.dent/Dentiste toothpaste fakes (Mar 2026) fall outside it.</li><li>FDA results (cases 12–25) are lab findings, not arrests.</li></ul>`}};
let LG=localStorage.getItem("lang")||"th",cat="all",bsel=null;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const URL0="https://piyaster11.github.io/thailand-fake-products-2026/";
const AB=new Map();Object.values(BR).flat().forEach(([n,t])=>AB.set(n,t));
function chip(n,t){return `<button class="bc ${t}${bsel==n?" sel":""}" data-b="${esc(n)}">${esc(n)}<em>${TL[LG][t]}</em></button>`}
function fmtD(d){if(LG=="en")return d;const m=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],p=d.split("-");return (p[2]?+p[2]+" ":"")+m[+p[1]-1]+" "+(+p[0]+543)}
function cn(k){return CATS[k][LG=="th"?0:1]}
function stats(){const tot=C.reduce((a,c)=>a+c.v,0);const chem=["ปรอท/Mercury","สเตียรอยด์/Steroids","ไฮโดรควิโนน/Hydroquinone","ไซบูทรามีน/Sibutramine","ซิลเดนาฟิล/Sildenafil","เมลาโทนิน/Melatonin","E. coli","ยาฉีดเปปไทด์/Peptide injections"];
$("stats").innerHTML=[C.length,"฿"+Math.round(tot),AB.size,Object.keys(CATS).length,chem.length].map((v,i)=>`<div class="stat"><b>${v}</b><small>${T[LG].st[i]}</small></div>`).join("");
$("chips").innerHTML=chem.map(x=>{const k=x.split("/").pop().toLowerCase();const n=C.filter(c=>c.p.en.toLowerCase().includes(k.split(" ")[0])).length;return `<span class="chip">⚗ ${LG=="th"?x.split("/")[0]:x.split("/").pop()}<i>${n||""}</i></span>`}).join("")}
function drawAll(){$("allbl").innerHTML=[...AB].sort((a,b)=>a[0].localeCompare(b[0])).map(([n,t])=>chip(n,t)).join("")}
function draw(){const qq=$("q").value.toLowerCase(),so=$("sort").value;let r=C.filter(c=>(cat=="all"||c.c==cat)&&(!bsel||(BR[c.id]||[]).some(x=>x[0]==bsel))&&(!qq||JSON.stringify([c.b,c.l,c.p,BR[c.id]]).toLowerCase().includes(qq)));
r.sort(so=="val"?(a,b)=>b.v-a.v:so=="cat"?(a,b)=>a.c.localeCompare(b.c)||b.d.localeCompare(a.d):(a,b)=>b.d.localeCompare(a.d));
$("grid").innerHTML=r.map(c=>{const k=CATS[c.c];return `<div class="c" id="case${c.id}"><div class="th">${c.img?`<img loading="lazy" src="${c.img}" alt="${esc(c.b.en)}">`:`<div class="ph" style="background:linear-gradient(135deg,${k[2]}55,#141821)">${k[3]}</div>`}<span class="cat" style="background:${k[2]}">${k[3]} ${cn(c.c)}</span></div><div class="bi"><b>${T[LG].bi}</b><div class="bl">${(BR[c.id]||[]).map(([n,t])=>chip(n,t)).join("")}</div></div><div class="bd"><h3>${esc(c.b[LG])}</h3><div class="meta">📍 ${esc(c.l[LG])}</div><div class="meta">📅 ${fmtD(c.d)}</div><div class="prob">⚗ ${esc(c.p[LG])}</div>${c.s[LG]!="—"?`<div class="sz">📦 ${esc(c.s[LG])}</div>`:""}<div class="ft"><span>#${c.id}${c.v?` · ${T[LG].val} ฿${c.v} ${LG=="th"?"ล้าน":"M"}`:""}</span><a href="${c.src}" target="_blank" rel="noopener">${T[LG].src} ↗</a></div></div></div>`}).join("")||`<p>${T[LG].none}</p>`}
function cats(){$("cats").innerHTML=`<button data-c="all" class="${cat=="all"?"on":""}">${T[LG].all} (${C.length})</button>`+Object.keys(CATS).map(k=>`<button data-c="${k}" class="${cat==k?"on":""}">${CATS[k][3]} ${cn(k)} (${C.filter(c=>c.c==k).length})</button>`).join("")}
function share(){const tx=LG=="th"?"⚠ เช็กก่อนซื้อ! รวมคดีสินค้าปลอม-อันตรายในไทย ส.ค.–พ.ย. 2569":"⚠ Fake & unsafe products busted in Thailand, Aug–Nov 2026";$("shl").href="https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(URL0);$("shf").href="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(URL0);$("shx").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(tx)+"&url="+encodeURIComponent(URL0);$("shc").textContent=T[LG].copy}
let markers=[];
function apply(){document.documentElement.lang=LG;localStorage.setItem("lang",LG);document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==LG));document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=T[LG][e.dataset.i]);$("h1").innerHTML=T[LG].h1;$("sub").textContent=T[LG].sub;$("tips").innerHTML=T[LG].tips;$("cav").innerHTML=T[LG].cav;$("q").placeholder=T[LG].q;const sv=$("sort").value||"date";$("sort").innerHTML=["date","val","cat"].map((v,i)=>`<option value="${v}">${T[LG].so[i]}</option>`).join("");$("sort").value=sv;share();stats();cats();drawAll();draw();
$("nol").innerHTML=C.filter(c=>!c.g).map(c=>`<li><a href="#" onclick="go(${c.id});return false">#${c.id} ${esc(c.b[LG])}</a> — ${esc(c.l[LG])}</li>`).join("");if(window.mp)pins()}
document.addEventListener("click",e=>{const lb=e.target.closest(".lang button");if(lb){LG=lb.dataset.l;apply();return}const b=e.target.closest(".bc");if(b){bsel=bsel==b.dataset.b?null:b.dataset.b;drawAll();draw();if(bsel)$("grid").scrollIntoView({behavior:"smooth"});return}const cb=e.target.closest("#cats button");if(cb){cat=cb.dataset.c;cats();draw()}const im=e.target.closest(".th img");if(im){$("lb").querySelector("img").src=im.src;$("lb").style.display="flex"}});
$("lb").onclick=()=>$("lb").style.display="none";$("q").oninput=draw;$("sort").onchange=draw;
$("shc").onclick=()=>{navigator.clipboard.writeText(URL0).then(()=>{$("shc").textContent=T[LG].copied;setTimeout(()=>$("shc").textContent=T[LG].copy,1500)})};
function go(id){cat="all";bsel=null;$("q").value="";cats();drawAll();draw();const e=$("case"+id);e.scrollIntoView({behavior:"smooth",block:"center"});e.classList.add("flash");setTimeout(()=>e.classList.remove("flash"),2000)}
let lg;function pins(){markers.forEach(m=>m.remove());markers=C.filter(c=>c.g).map(c=>L0.circleMarker(c.g,{radius:9,color:"#fff",weight:1.5,fillColor:CATS[c.c][2],fillOpacity:.9}).addTo(mp).bindPopup(`<b>#${c.id} ${esc(c.b[LG])}</b><br>📍 ${esc(c.l[LG])}<br>📅 ${fmtD(c.d)}<br>⚗ ${esc(c.p[LG])}<br><a href="#" onclick="go(${c.id});return false">${T[LG].go} →</a>`));if(lg)lg.remove();lg=L0.control({position:"bottomright"});lg.onAdd=()=>{const d=L0.DomUtil.create("div");d.style.cssText="background:#141821;color:#e8ecf3;padding:8px 10px;border-radius:8px;font-size:12px";d.innerHTML=Object.keys(CATS).map(k=>`<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${CATS[k][2]}"></span> ${cn(k)}</div>`).join("");return d};lg.addTo(mp)}
const L0=window.L;let mp;
try{mp=L0.map("map",{scrollWheelZoom:false}).setView([13.2,101],6);L0.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(mp);window.mp=mp}catch(e){$("map").textContent="Map failed to load"}
apply();
